<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebBridgeKit v2 示例</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: #1f2933;
            background: #f6f8fa;
        }

        h1 {
            margin: 0 0 16px;
            font-size: 22px;
        }

        .section {
            margin: 14px 0;
            padding: 14px;
            border: 1px solid #d9e2ec;
            border-radius: 6px;
            background: #ffffff;
        }

        .section-title {
            margin-bottom: 10px;
            font-weight: 700;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 8px 0;
        }

        input,
        select {
            min-width: 220px;
            padding: 10px;
            border: 1px solid #bcccdc;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            padding: 10px 14px;
            border: 0;
            border-radius: 4px;
            color: #ffffff;
            background: #2563eb;
            font-size: 14px;
        }

        button.danger {
            background: #dc2626;
        }

        button.secondary {
            background: #4b5563;
        }

        label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        #statusDiv {
            padding: 10px;
            border-radius: 4px;
            background: #fee2e2;
            color: #991b1b;
        }

        #statusDiv.connected {
            background: #dcfce7;
            color: #166534;
        }

        #appMessageResult,
        #deviceInfo,
        #scanResult,
        #discoveredDevices {
            min-height: 24px;
            padding: 8px;
            border-radius: 4px;
            background: #f1f5f9;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .device-item {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin: 6px 0;
            padding: 8px;
            border: 1px solid #d9e2ec;
            border-radius: 4px;
            background: #ffffff;
        }

        .device-meta {
            color: #52606d;
            font-size: 12px;
        }

        #messageLog {
            height: 220px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #d9e2ec;
            border-radius: 6px;
            background: #111827;
            color: #e5e7eb;
            font-family: Consolas, monospace;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <h1>WebBridgeKit v2 示例</h1>

    <div class="section">
        <div class="section-title">设备信息</div>
        <div class="row">
            <button onclick="refreshDeviceInfo()">刷新设备信息</button>
            <button class="secondary" onclick="refreshBluetoothStatus()">刷新蓝牙状态</button>
        </div>
        <div id="deviceInfo">等待设备信息...</div>
    </div>

    <div class="section">
        <div class="section-title">App 通信</div>
        <div class="row">
            <select id="messageType">
                <option value="h5Message">普通消息</option>
                <option value="userInfo">用户信息</option>
                <option value="action">操作请求</option>
            </select>
            <input id="messageContent" type="text" value="Hello from H5 v2">
            <button onclick="sendMessageToApp()">发送到 App</button>
        </div>
        <div id="appMessageResult">等待 App 消息...</div>
    </div>

    <div class="section">
        <div class="section-title">扫码</div>
        <div class="row">
            <button onclick="startScan()">开始扫码</button>
        </div>
        <div id="scanResult">等待扫码结果...</div>
    </div>

    <div class="section">
        <div class="section-title">蓝牙</div>
        <div id="statusDiv">设备状态：未连接</div>
        <div class="row">
            <input id="macAddress" type="text" placeholder="5C:53:10:7A:1C:80" value="5C:53:10:7A:1C:80">
            <button onclick="connectDevice()">连接设备</button>
            <button class="danger" onclick="disconnectDevice()">断开连接</button>
            <button class="secondary" onclick="loadPairedDevices()">读取已配对设备</button>
        </div>
        <div class="row">
            <button onclick="startBluetoothDiscovery()">开始搜索</button>
            <button class="secondary" onclick="stopBluetoothDiscovery()">停止搜索</button>
            <button class="secondary" onclick="loadDiscoveredDevices()">读取已发现设备</button>
        </div>
        <div id="discoveredDevices">尚未搜索设备</div>
        <div class="row">
            <input id="serviceUUID" type="text" placeholder="服务 UUID" value="0000FFF0-0000-1000-8000-00805F9B34FB">
            <input id="characteristicUUID" type="text" placeholder="特征值 UUID"
                value="0000FFF2-0000-1000-8000-00805F9B34FB">
            <input id="sendData" type="text" placeholder="十六进制数据" value="7B864814071027923000280033BD7D">
            <button onclick="sendBluetoothData()">发送数据</button>
        </div>
        <label>
            <input id="notificationsSwitch" type="checkbox" checked onchange="toggleNotifications()">
            接收设备通知
        </label>
    </div>

    <div id="messageLog"></div>

    <script>
        // 初始化 WebBridge
        const WebBridge = (function () {
            const pending = new Map();
            const listeners = new Map();
            let nativeMode = null;

            function bindNative() {
                if (nativeMode) return true;
                if (window.WebBridgeNative) {
                    window.WebBridgeNative.onmessage = function (event) {
                        handleMessage(event.data);
                    };
                    nativeMode = 'webMessage';
                    return true;
                }
                if (window.WebBridgeNativeFallback) {
                    window.__WebBridgeFallbackDispatch = function (message) {
                        handleMessage(message);
                    };
                    nativeMode = 'fallback';
                    return true;
                }
                return false;
            }

            function postNativeMessage(message) {
                if (nativeMode === 'webMessage') {
                    window.WebBridgeNative.postMessage(message);
                    return;
                }
                if (nativeMode === 'fallback') {
                    window.WebBridgeNativeFallback.postMessage(message);
                    return;
                }
                throw new Error('原生桥未注入');
            }

            function bridgeUnavailableMessage() {
                if (!window.WebBridgeNative && !window.WebBridgeNativeFallback) {
                    return '原生桥未注入';
                }
                return '原生桥未就绪';
            }

            function handleMessage(raw) {
                let message;
                try {
                    message = typeof raw === 'string' ? JSON.parse(raw) : raw;
                } catch (error) {
                    logMessage('桥接消息解析失败: ' + error.message);
                    return;
                }

                if (message && message.id && pending.has(message.id)) {
                    const callbacks = pending.get(message.id);
                    pending.delete(message.id);
                    if (message.ok) callbacks.resolve(message.data);
                    else callbacks.reject(message.error || { code: 'UNKNOWN', message: '未知错误' });
                    return;
                }

                if (message && message.event) {
                    dispatch(message);
                }
            }

            function dispatch(message) {
                const handlers = listeners.get(message.event) || [];
                handlers.forEach(handler => handler(message.data || {}));
            }

            function invoke(feature, action, payload) {
                if (!bindNative()) {
                    return Promise.reject({ code: 'BRIDGE_UNAVAILABLE', message: bridgeUnavailableMessage() });
                }

                const id = 'req_' + Date.now() + '_' + Math.random().toString(16).slice(2);
                const request = { id, feature, action, payload: payload || {} };
                return new Promise((resolve, reject) => {
                    pending.set(id, { resolve, reject });
                    postNativeMessage(JSON.stringify(request));
                    setTimeout(() => {
                        if (pending.has(id)) {
                            pending.delete(id);
                            reject({ code: 'TIMEOUT', message: '原生响应超时' });
                        }
                    }, 30000);
                });
            }

            function on(event, handler) {
                const handlers = listeners.get(event) || [];
                handlers.push(handler);
                listeners.set(event, handlers);
            }

            return {
                invoke,
                on,
                __dispatch: dispatch
            };
        })();
        // 绑定 WebBridge 到 window
        window.WebBridge = WebBridge;
        // 记录日志
        function logMessage(message) {
            const log = document.getElementById('messageLog');
            const line = document.createElement('div');
            const text = '[' + new Date().toLocaleTimeString() + '] ' + message;
            line.textContent = text;
            log.appendChild(line);
            log.scrollTop = log.scrollHeight;
            console.log('[WebBridgeKit H5] ' + message);
            mirrorLogToNative(text);
        }
        // 将 H5 页面日志同步到 Android Logcat，便于 USB 连接电脑调试。
        function mirrorLogToNative(text) {
            if (!window.WebBridge || typeof WebBridge.invoke !== 'function') {
                return;
            }
            WebBridge.invoke('message', 'sendToApp', {
                type: 'h5Log',
                data: {
                    message: text,
                    timestamp: Date.now()
                }
            }).catch(function () {
                // 调试日志上报失败时不影响页面主流程。
            });
        }
        // 显示错误信息
        function showError(prefix, error) {
            const message = error && error.message ? error.message : String(error);
            logMessage(prefix + ': ' + message);
        }
        // 刷新设备信息
        async function refreshDeviceInfo() {
            try {
                const info = await WebBridge.invoke('device', 'getInfo');
                document.getElementById('deviceInfo').textContent = JSON.stringify(info, null, 2);
                logMessage('设备信息已刷新');
            } catch (error) {
                showError('设备信息获取失败', error);
            }
        }
        // 刷新蓝牙状态
        async function refreshBluetoothStatus() {
            try {
                const status = await WebBridge.invoke('bluetooth', 'getStatus');
                updateStatus(status.connected ? '已连接' : '未连接', status.connected);
                logMessage('蓝牙状态: ' + JSON.stringify(status));
            } catch (error) {
                showError('蓝牙状态获取失败', error);
            }
        }
        // 发送 App 消息
        async function sendMessageToApp() {
            try {
                const type = document.getElementById('messageType').value;
                const text = document.getElementById('messageContent').value;
                await WebBridge.invoke('message', 'sendToApp', {
                    type,
                    data: {
                        text,
                        timestamp: Date.now()
                    }
                });
                logMessage('已发送消息到 App: ' + type);
            } catch (error) {
                showError('发送 App 消息失败', error);
            }
        }
        // 开始扫码
        async function startScan() {
            try {
                const result = await WebBridge.invoke('camera', 'scanQr');
                document.getElementById('scanResult').textContent = result.text || '';
                logMessage('扫码结果: ' + (result.text || ''));
            } catch (error) {
                showError('扫码失败', error);
            }
        }
        // 加载已配对设备
        async function loadPairedDevices() {
            try {
                const result = await WebBridge.invoke('bluetooth', 'getPairedDevices');
                logMessage('已配对设备: ' + JSON.stringify(result.devices || []));
            } catch (error) {
                showError('读取已配对设备失败', error);
            }
        }
        // 开始搜索蓝牙设备
        async function startBluetoothDiscovery() {
            try {
                await WebBridge.invoke('bluetooth', 'startDiscovery');
                logMessage('蓝牙搜索已开始');
            } catch (error) {
                showError('开始搜索失败', error);
            }
        }
        // 停止搜索蓝牙设备
        async function stopBluetoothDiscovery() {
            try {
                await WebBridge.invoke('bluetooth', 'stopDiscovery');
                logMessage('蓝牙搜索已停止');
            } catch (error) {
                showError('停止搜索失败', error);
            }
        }
        // 读取已发现设备
        async function loadDiscoveredDevices() {
            try {
                const result = await WebBridge.invoke('bluetooth', 'getDiscoveredDevices');
                renderDiscoveredDevices(result.devices || []);
                logMessage('已发现设备: ' + JSON.stringify(result.devices || []));
            } catch (error) {
                showError('读取已发现设备失败', error);
            }
        }
        // 渲染搜索到的设备
        function renderDiscoveredDevices(devices) {
            const box = document.getElementById('discoveredDevices');
            box.innerHTML = '';
            if (!devices.length) {
                box.textContent = '尚未发现设备';
                return;
            }
            devices.forEach(device => {
                const item = document.createElement('div');
                item.className = 'device-item';

                const info = document.createElement('div');
                const name = document.createElement('div');
                name.textContent = device.name || 'Unknown';
                const meta = document.createElement('div');
                meta.className = 'device-meta';
                const rssi = device.rssi === undefined || device.rssi === null ? '' : device.rssi;
                meta.textContent = (device.address || '') + ' RSSI: ' + rssi;
                info.appendChild(name);
                info.appendChild(meta);

                const button = document.createElement('button');
                button.className = 'secondary';
                button.textContent = '填入 MAC';
                button.onclick = () => {
                    document.getElementById('macAddress').value = device.address || '';
                    logMessage('已选择设备: ' + JSON.stringify(device));
                };

                item.appendChild(info);
                item.appendChild(button);
                box.appendChild(item);
            });
        }
        // 连接蓝牙设备
        async function connectDevice() {
            try {
                const macAddress = document.getElementById('macAddress').value.trim();
                await WebBridge.invoke('bluetooth', 'connect', { macAddress });
                logMessage('连接请求已发送: ' + macAddress);
            } catch (error) {
                showError('连接失败', error);
            }
        }
        // 断开蓝牙连接
        async function disconnectDevice() {
            try {
                await WebBridge.invoke('bluetooth', 'disconnect');
                logMessage('断开请求已发送');
            } catch (error) {
                showError('断开失败', error);
            }
        }
        // 发送蓝牙数据
        async function sendBluetoothData() {
            try {
                const serviceUUID = document.getElementById('serviceUUID').value.trim();
                const characteristicUUID = document.getElementById('characteristicUUID').value.trim();
                const hex = document.getElementById('sendData').value.trim().replace(/\s/g, '').toUpperCase();
                await WebBridge.invoke('bluetooth', 'writeHex', { serviceUUID, characteristicUUID, hex });
                logMessage('写入请求已发送: ' + hex);
            } catch (error) {
                showError('写入失败', error);
            }
        }
        // 切换设备通知
        async function toggleNotifications() {
            try {
                const enabled = document.getElementById('notificationsSwitch').checked;
                await WebBridge.invoke('bluetooth', 'setNotificationsEnabled', { enabled });
                logMessage('设备通知已' + (enabled ? '开启' : '关闭'));
            } catch (error) {
                showError('切换通知失败', error);
            }
        }
        // 更新设备状态显示
        function updateStatus(text, connected) {
            const statusDiv = document.getElementById('statusDiv');
            statusDiv.textContent = '设备状态：' + text;
            statusDiv.className = connected ? 'connected' : '';
        }
        // 监听 App 消息事件
        WebBridge.on('message.fromApp', data => {
            document.getElementById('appMessageResult').textContent = JSON.stringify(data, null, 2);
            logMessage('收到 App 消息: ' + JSON.stringify(data));
        });
        // 监听蓝牙连接事件
        WebBridge.on('bluetooth.connected', data => {
            updateStatus('已连接 - ' + (data.address || ''), true);
            logMessage('蓝牙已连接: ' + (data.address || ''));
        });
        // 监听蓝牙断开事件
        WebBridge.on('bluetooth.disconnected', data => {
            updateStatus('未连接', false);
            logMessage('蓝牙已断开: ' + (data.address || ''));
        });
        // 监听蓝牙错误事件
        WebBridge.on('bluetooth.error', data => {
            logMessage('蓝牙错误: ' + (data.message || JSON.stringify(data)));
        });
        // 监听蓝牙状态变化事件
        WebBridge.on('bluetooth.stateChanged', data => {
            logMessage('蓝牙状态变化: ' + (data.message || JSON.stringify(data)));
        });
        // 监听蓝牙搜索事件
        WebBridge.on('bluetooth.discoveryStarted', data => {
            logMessage('蓝牙搜索开始: ' + JSON.stringify(data));
        });
        WebBridge.on('bluetooth.discoveryStopped', data => {
            logMessage('蓝牙搜索停止: ' + JSON.stringify(data));
        });
        WebBridge.on('bluetooth.deviceFound', data => {
            logMessage('发现蓝牙设备: ' + JSON.stringify(data));
            loadDiscoveredDevices();
        });
        // 监听蓝牙服务发现事件
        WebBridge.on('bluetooth.servicesDiscovered', data => {
            logMessage('发现服务: ' + JSON.stringify(data.services || []));
        });
        // 监听蓝牙特征值变化事件
        WebBridge.on('bluetooth.characteristicChanged', data => {
            logMessage('收到设备数据: ' + JSON.stringify(data));
        });
        // 监听蓝牙写入完成事件
        WebBridge.on('bluetooth.writeCompleted', data => {
            logMessage('写入完成: ' + JSON.stringify(data));
        });
        // 监听相机扫码结果事件
        WebBridge.on('camera.qrResult', data => {
            document.getElementById('scanResult').textContent = data.text || '';
        });
        // 监听页面加载完成事件
        window.addEventListener('DOMContentLoaded', () => {
            refreshDeviceInfo();
            refreshBluetoothStatus();
        });
    </script>
</body>

</html>
